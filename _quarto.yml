project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - accessibility.qmd
    - 1_source_data_loading/*.qmd
    - 2_training_data_generation/*.qmd

website:
  title: "Periodic Table of NLP Tasks in R"
  description: "Practical notes on natural language processing tasks in R."
  repo-url: "https://github.com/farach/periodic_table_nlp"
  repo-actions: [source, issue]
  search: true
  page-navigation: true
  navbar:
    right:
      - text: "GitHub"
        href: "https://github.com/farach/periodic_table_nlp"
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Home
      - href: 1_source_data_loading/01-bits-to-character-encoding.qmd
        text: How computers store text
      - href: 1_source_data_loading/02-manual-typewriting.qmd
        text: Finding patterns in text
      - href: 1_source_data_loading/03-loading-structured-datafile.qmd
        text: Loading a structured data file
      - href: 1_source_data_loading/04-generating-a-corpus.qmd
        text: Building a text corpus
      - href: 1_source_data_loading/05-loading-from-api.qmd
        text: Loading data from an API
      - href: 1_source_data_loading/06-text-and-file-scraping.qmd
        text: Collecting text from a web page
      - href: 1_source_data_loading/07-text-extraction-and-ocr.qmd
        text: Extracting text from an image
      - href: 2_training_data_generation/08-manual-annotation.qmd
        text: Turning decisions into labels
      - href: 2_training_data_generation/09-annotation-with-active-learning.qmd
        text: Choosing what to label next
      - href: 2_training_data_generation/10-training-data-providers.qmd
        text: Choosing an outside data provider
      - href: 2_training_data_generation/11-crowdsourcing-annotation.qmd
        text: Working with several annotators
      - href: 2_training_data_generation/12-textual-data-augmentation.qmd
        text: Creating more training examples
      - href: 2_training_data_generation/13-rule-based-training-data.qmd
        text: Labeling text with rules
      - href: accessibility.qmd
        text: Accessibility
  page-footer:
    left: "Plain-language NLP lessons with examples that run."
    right:
      - text: "Accessibility"
        href: accessibility.qmd
      - text: "Source"
        href: "https://github.com/farach/periodic_table_nlp"

format:
  html:
    theme: cosmo
    css:
      - styles.css
      - periodic-table.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    anchor-sections: false
    title-block-banner: true
    include-before-body: accessibility-before-body.html
    include-after-body: accessibility-after-body.html

execute:
  eval: true
  echo: true
  output: true
  warning: true
  message: false
  error: false
  cache: false

lang: en
