project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - accessibility.qmd
    - using-language-models.qmd
    - advanced/index.qmd
    - advanced/evaluating-systems.qmd
    - 1_source_data_loading/*.qmd
    - 2_training_data_generation/*.qmd
    - 3_word_parsing/*.qmd
    - 4_word_processing/*.qmd
    - 5_phrases_and_entities/*.qmd
    - 6_entity_enrichment/*.qmd
    - 7_sentences_and_paragraphs/*.qmd
    - 8_documents/*.qmd
    - 9_model_development/*.qmd
    - 10_classification/*.qmd
    - 11_signals_and_discovery/*.qmd
    - 12_similarity/*.qmd
    - 13_natural_language_generation/*.qmd
    - 14_systems/*.qmd
    - 15_information_visualization/*.qmd

