format:
  html:
    theme: cosmo
    css:
      - styles.css
      - periodic-table.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    anchor-sections: false
    title-block-banner: true
    include-before-body: accessibility-before-body.html
    include-after-body: accessibility-after-body.html

execute:
  eval: true
  echo: true
  output: true
  warning: true
  error: false
  cache: false

knitr:
  opts_chunk:
    message: false
    dev: ragg_png

lang: en
