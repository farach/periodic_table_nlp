name: Render Quarto site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org

    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install native R package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpoppler-cpp-dev \
            libqpdf-dev \
            libtesseract-dev \
            libleptonica-dev \
            libprotobuf-dev \
            protobuf-compiler \
            poppler-data \
            tesseract-ocr \
            tesseract-ocr-eng

      - uses: r-lib/actions/setup-renv@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install spaCy and its English pipeline
        run: |
          python -m venv .venv-spacy
          .venv-spacy/bin/python -m pip install --upgrade pip
          .venv-spacy/bin/python -m pip install -r requirements-spacy.txt
          .venv-spacy/bin/python -c "import spacy; spacy.load('en_core_web_sm')"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check writing
        run: Rscript scripts/check-prose.R

      - name: Check repetition across lessons
        run: Rscript scripts/check-repetition.R

      - name: Render site
        run: quarto render

      - name: Check lessons
        run: Rscript scripts/check-lessons.R

      - name: Test periodic table
        run: Rscript tests/test-periodic-table.R

      - name: Test workforce data
        run: Rscript tests/test-workforce-data.R

      - name: Test accessibility
        run: npm run test:a11y
