<script>
document.addEventListener("DOMContentLoaded", () => {
  const skipLink = document.querySelector(".skip-link");
  const mainContent = document.querySelector("#quarto-document-content");
  if (skipLink && mainContent) {
    document.body.prepend(skipLink);
    mainContent.setAttribute("tabindex", "-1");
    skipLink.addEventListener("click", (event) => {
      event.preventDefault();
      mainContent.focus();
      history.replaceState(null, "", "#quarto-document-content");
    });
  }

  const navbarToggle = document.querySelector(".navbar-toggler");
  if (navbarToggle) {
    navbarToggle.removeAttribute("role");
  }

  const siteNavigation = document.querySelector("#quarto-header nav");
  if (siteNavigation && !siteNavigation.getAttribute("aria-label")) {
    siteNavigation.setAttribute("aria-label", "Site navigation");
  }

  const lessonNavigation = document.querySelector("#quarto-sidebar");
  if (lessonNavigation && !lessonNavigation.getAttribute("aria-label")) {
    lessonNavigation.setAttribute("aria-label", "Lesson navigation");
  }

  const pageContents = document.querySelector("#TOC");
  if (pageContents && !pageContents.getAttribute("aria-label")) {
    pageContents.setAttribute("aria-label", "On this page");
  }

  document.querySelectorAll("main table").forEach((table) => {
    const parent = table.parentElement;
    if (
      parent?.matches(
        ".cell-output-display, .table-responsive, .table-scroll"
      )
    ) {
      return;
    }

    const wrapper = document.createElement("div");
    wrapper.className = "table-scroll";
    parent.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });

  const makeScrollableOutputsFocusable = () => {
    document
      .querySelectorAll(
        ".cell-output-display, .cell-output-stdout > pre, " +
          ".cell-output-stderr > pre, .table-scroll, " +
          "div.sourceCode, pre.sourceCode"
      )
      .forEach((output) => {
        if (output.scrollWidth <= output.clientWidth) {
          return;
        }

        const section = output.closest("section[id]");
        const heading = section?.querySelector("h2, h3, h4");
        const sectionName = heading?.textContent.trim() || "R";
        const isSource = output.classList.contains("sourceCode");
        output.setAttribute("tabindex", "0");
        output.setAttribute("role", "region");
        output.setAttribute(
          "aria-label",
          isSource
            ? `Scrollable ${sectionName} code`
            : `Scrollable ${sectionName} output`
        );
      });
  };

  window.requestAnimationFrame(makeScrollableOutputsFocusable);
  window.addEventListener("resize", makeScrollableOutputsFocusable);

  const taskMap = document.querySelector("#nlp-task-map");
  const mapButtons = document.querySelectorAll(
    "[data-map-direction]"
  );

  if (taskMap && mapButtons.length > 0) {
    const updateMapButtons = () => {
      const maximum =
        taskMap.scrollWidth - taskMap.clientWidth;

      mapButtons.forEach((button) => {
        const direction = Number(
          button.dataset.mapDirection
        );
        button.disabled = direction < 0
          ? taskMap.scrollLeft <= 20
          : taskMap.scrollLeft >= maximum - 20;
      });
    };

    mapButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const direction = Number(
          button.dataset.mapDirection
        );
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        taskMap.scrollBy({
          left: direction * taskMap.clientWidth * 0.8,
          behavior: reducedMotion ? "auto" : "smooth"
        });
      });
    });

    taskMap.addEventListener("scroll", updateMapButtons);
    window.addEventListener("resize", updateMapButtons);
    updateMapButtons();
  }
});

let searchInvoker = null;

document.addEventListener("click", (event) => {
  const trigger = event.target.closest("#quarto-search button");
  if (trigger) {
    searchInvoker = trigger;
  }
}, true);

document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || !searchInvoker) {
    return;
  }

  const trigger = searchInvoker;
  searchInvoker = null;

  window.setTimeout(() => {
    trigger.focus();
  }, 100);
}, true);
</script>
